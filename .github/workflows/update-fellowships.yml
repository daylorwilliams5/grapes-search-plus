name: Update Fellowship Data

# Merges the latest GRAPES spreadsheet into the site at the start of each
# UCLA academic cycle:
#   Fall    → September 1
#   Winter  → January 1
#   Spring  → March 15
#   Summer  → June 15
# The spreadsheet comes from the newest .xlsx in data/, or from a link given
# when running the workflow by hand from the Actions tab. With neither, the
# run does nothing.

on:
  schedule:
    - cron: '0 8 1 9 *'   # Sep 1  — Fall cycle
    - cron: '0 8 1 1 *'   # Jan 1  — Winter cycle
    - cron: '0 8 15 3 *'  # Mar 15 — Spring cycle
    - cron: '0 8 15 6 *'  # Jun 15 — Summer cycle
  workflow_dispatch:
    inputs:
      spreadsheet_url:
        description: 'Direct download link to the latest GRAPES .xlsx spreadsheet (optional)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas openpyxl python-dateutil

      - name: Download spreadsheet (if a link was given)
        if: ${{ github.event.inputs.spreadsheet_url != '' }}
        env:
          SPREADSHEET_URL: ${{ github.event.inputs.spreadsheet_url }}
        run: |
          curl -fsSL "$SPREADSHEET_URL" -o data/GRAPES_latest.xlsx
          echo "Downloaded spreadsheet."

      - name: Find spreadsheet
        id: check
        run: |
          SHEET=$(ls -t data/*.xlsx 2>/dev/null | head -1)
          if [ -n "$SHEET" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "sheet=$SHEET" >> "$GITHUB_OUTPUT"
            echo "Using spreadsheet: $SHEET"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No spreadsheet in data/ and no link given. Nothing to update."
          fi

      - name: Extract fellowship records
        if: steps.check.outputs.found == 'true'
        env:
          SHEET: ${{ steps.check.outputs.sheet }}
        run: |
          python scripts/01_extract.py --input "$SHEET" --output data/fellowships_base.json

      - name: Merge and rebuild the site
        if: steps.check.outputs.found == 'true'
        run: |
          python scripts/03_merge_and_rebuild.py \
            --data data/fellowships_master.json \
            --base data/fellowships_base.json \
            --template grapes-fellowship-finder.html \
            --output grapes-fellowship-finder.html

      - name: Commit and push if anything changed
        if: steps.check.outputs.found == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add grapes-fellowship-finder.html data/fellowships_master.json data/new_from_spreadsheet.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            m=$(date +%-m)
            if [ "$m" -ge 9 ]; then CYCLE=Fall; elif [ "$m" -ge 6 ]; then CYCLE=Summer; elif [ "$m" -ge 3 ]; then CYCLE=Spring; else CYCLE=Winter; fi
            git commit -m "Auto-update: $CYCLE cycle $(date +'%Y-%m-%d')"
            git push
          fi
